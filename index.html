<style>
  :root {
    --paper:#EFEEE7; --card:#FFFFFF; --ink:#191A16; --ink-2:#5C5F59; --ink-3:#8C8F88;

    --panel:#1A1D22; --panel-2:#23272E;

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 34px 14px 64px;
    font-family: var(--sans);
    background:

      var(--paper);
    background-attachment: fixed;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "kern" 1;
  }
  #root { max-width: 760px; margin: 0 auto; }
  input, select, textarea, button { font-family: inherit; }
  a { color: inherit; }
  ::selection { background: #1A1D22; color: #EFEEE7; }

  /* focus visibility, kept out of the way for mouse users */
  :focus-visible { outline: 2px solid #2F5FA8; outline-offset: 2px; border-radius: 4px; }

  /* ---------- masthead ---------- */
  .masthead { display:flex; justify-content:space-between; align-items:flex-end; gap:12px;
    flex-wrap:wrap; padding-bottom:14px; margin-bottom:18px; border-bottom:1.5px solid var(--ink); }
  .masthead h1 { font-size:27px; font-weight:700; letter-spacing:-.028em; margin:0; line-height:1.05; }
  .masthead .kicker { font-family:var(--mono); font-size:9.5px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--ink-3); margin-bottom:7px; }
  .masthead .today { font-family:var(--mono); font-size:11px; color:var(--ink-2); }

  /* ---------- runway ---------- */
  .runway { background:linear-gradient(168deg, var(--panel-2), var(--panel));
    border-radius:14px; padding:16px 18px 14px; margin-bottom:18px;
    box-shadow: 0 1px 2px rgba(20,22,18,.16), 0 12px 26px -14px rgba(20,22,18,.5); }
  .runway-head { display:flex; justify-content:space-between; align-items:flex-start;
    gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .runway-eyebrow { font-family:var(--mono); font-size:9px; letter-spacing:.18em;
    text-transform:uppercase; color:#7F8794; margin-bottom:3px; }
  .runway-title { font-size:16px; font-weight:600; color:#F2F3F0; letter-spacing:-.015em; }
  .runway-nums { display:flex; gap:20px; }
  .runway-num { text-align:right; }
  .runway-num span { font-family:var(--mono); font-size:23px; font-weight:600; line-height:1; display:block; }
  .runway-num small { font-family:var(--mono); font-size:9px; letter-spacing:.08em;
    color:#7F8794; display:block; margin-top:3px; }

  .runway-body { display:flex; align-items:flex-start; gap:12px; }
  .runway-gate { flex:0 0 auto; width:62px; height:80px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px; cursor:pointer;
    background:rgba(63,214,154,.09); border:1px solid rgba(63,214,154,.32);
    border-radius:9px; padding:8px 4px; font-family:var(--mono); }
  .runway-gate:hover, .runway-gate.on { background:rgba(63,214,154,.17); border-color:rgba(63,214,154,.6); }
  .runway-gate-n { font-size:23px; font-weight:600; color:#3FD69A; line-height:1; }
  .runway-gate-l { font-size:8.5px; letter-spacing:.16em; text-transform:uppercase; color:#5E9C82; }
  .runway-gate-stack { display:flex; flex-wrap:wrap; gap:2px; justify-content:center;
    margin-top:6px; max-width:48px; }
  .runway-gate-stack i { width:5px; height:5px; border-radius:1px; background:#3FD69A; opacity:.75; }
  .runway-plot { position:relative; flex:1; min-width:0; height:80px; margin-bottom:15px;
    border-top:1px solid rgba(255,255,255,.11); border-bottom:1px solid rgba(255,255,255,.11); }
  .runway-overflow { position:absolute; right:2px; top:6px; font-family:var(--mono);
    font-size:9px; padding:1px 5px; border-radius:4px; background:rgba(255,255,255,.1);
    color:#AEB6C2; cursor:help; }
  .runway-tick { position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,.07); }
  .runway-tick-label { position:absolute; bottom:-14px; left:5px; font-family:var(--mono);
    font-size:8px; letter-spacing:.1em; text-transform:uppercase; color:#666E7B; white-space:nowrap; }
  .runway-pip { position:absolute; width:8px; height:8px; border-radius:2px; border:none;
    padding:0; cursor:pointer; transform:translateX(-4px); box-shadow:0 0 0 0 rgba(255,255,255,0); }
  .runway-pip.est { box-shadow: inset 0 0 0 2px var(--panel); opacity:.85; }
  .runway-pip:hover, .runway-pip.on, .runway-pip:focus-visible {
    transform:translateX(-4px) scale(1.9); z-index:5; box-shadow:0 0 0 3px rgba(255,255,255,.16); }
  .runway-readout { font-family:var(--mono); font-size:10.5px; color:#C3C9D2; margin-top:9px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .runway-readout b { color:#F2F3F0; font-weight:600; }
  .runway-legend { display:flex; gap:13px; flex-wrap:wrap; margin-top:9px;
    font-family:var(--mono); font-size:9px; letter-spacing:.05em; color:#7F8794; align-items:center; }
  .runway-legend i { display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:5px;
    vertical-align:middle; }
  .runway-legend-note { margin-left:auto; opacity:.7; }

  /* ---------- stats ---------- */
  .stats { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; margin-bottom:18px; }
  .stat { display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; background:var(--card); border:1px solid var(--rule); border-radius:var(--r);
    padding:12px 6px; text-align:center; font-family:var(--sans); }
  .stat.clickable { cursor:pointer; }
  .stat.clickable:hover { border-color:var(--rule-2); background:#FFFEFA; }
  .stat.on { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
  .stat-n { font-family:var(--mono); font-size:22px; font-weight:600; line-height:1.05; }
  .stat-l { font-size:10.5px; color:var(--ink-3); letter-spacing:.01em; }

  /* ---------- cards ---------- */
  .card { border-radius:var(--r); border:1px solid var(--rule); background:var(--card);
    margin-bottom:7px; overflow:hidden; box-shadow:0 1px 1px rgba(25,26,22,.03); }
  .card:hover { border-color:var(--rule-2); box-shadow:0 1px 2px rgba(25,26,22,.07); }
  .card.open { border-color:var(--rule-2); box-shadow:0 2px 4px rgba(25,26,22,.06), 0 14px 30px -20px rgba(25,26,22,.4); }
  .tier-head { font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.16em;
    color:var(--ink-3); text-transform:uppercase; margin:26px 0 8px; display:flex;
    align-items:center; gap:10px; }
  .tier-head::after { content:""; flex:1; height:1px; background:var(--rule); }

  @media (prefers-reduced-motion: no-preference) {
    .card, .stat, .runway-pip { transition: all 150ms cubic-bezier(.2,.7,.3,1); }
  }
  @media (max-width: 620px) {
    body { padding:22px 10px 48px; }
    .masthead h1 { font-size:23px; }
    .stats { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .runway-plot { height:74px; }
    .runway-gate { height:74px; }
    .runway-gate { width:52px; }
    .runway-gate-n { font-size:19px; }
    .runway-legend-note { display:none; }
  }
</style>
</head>

    tip:"Returned a 5xx server error on " + LINKCHECK_DATE + " \u2014 that is the site being broken, not bot-blocking and not an empty board. Retry in a few days rather than concluding there are no postings." };
  return { s:"unknown", label:"link unchecked", bg:"#FAEEDA", fg:"#633806",
    tip:"Added after the " + LINKCHECK_DATE + " sweep, or edited by you. Not verified." };
}

/* ---------- date helpers ---------- */
function daysUntil(d) {
  if (!d) return null;

}

   silently reading as fact — that default is the whole point of this field. */
function confOf(o) { return o.conf || "estimate"; }

function countdownBadge(o) {
  const c = confOf(o);
  if (c === "closed") return { label:"closed", bg:"#FCEBEB", fg:"#A32D2D" };
  if (o.urgent && !o.openDate) return { label:"outreach now", bg:"#FAEEDA", fg:"#633806" };
  const d = daysUntil(o.openDate);
  const est = c === "estimate";
  // "~" prefix on every estimated countdown, so a hard number never implies a hard date.
  const p = est ? "~" : "";
  if (d === null) return { label: o.appWin || "—", bg:"#F1EFE8", fg:"#6b6b67" };
  if (d <= 0)  return { label: est ? "~open" : "open now", bg:"#E1F5EE", fg:"#085041" };
  if (d <= 14) return { label:`${p}${d}d`, bg:"#FCEBEB", fg:"#A32D2D" };
  if (d <= 45) return { label:`${p}${d}d`, bg:"#FAEEDA", fg:"#633806" };
  if (d <= 90) return { label:`${p}${d}d`, bg:"#E6F1FB", fg:"#0C447C" };
  return { label:`~${Math.round(d/30.5)}mo`, bg:"#F1EFE8", fg:"#8c8c88" };
}
/* "Open now" = the window is open today, or it's an outreach target with no window
   at all. "Act now" = open now, or opening inside two weeks. Act now is deliberately
   a superset of open now: something opening in nine days still needs a resume ready. */
function isOpenNow(o) {
  if (confOf(o) === "closed") return false;
  if (o.urgent && !o.openDate) return true;
  const d = daysUntil(o.openDate);
  return d !== null && d <= 0;
}
function isActNow(o) {
  if (confOf(o) === "closed") return false;
  if (o.urgent) return true;
  const d = daysUntil(o.openDate);
  return d !== null && d <= 14;
}

   ------------------------------------------------------------
   These are hidden because they are not winnable for Class of 2029 in summer
   2027, not because they are bad: flatly ineligible on class year or credits,
   scoped to identity groups, programs whose websites have gone dark, CS/SWE
   tracks where the evidence isn't, or redundant with a better row already here.
   Nothing is deleted — every one of these is one "show hidden" click away, and
   several become live targets in the 2028 cycle.

   Seeded ONCE, on first load after this version. Anything you unhide afterwards
   stays unhidden; the seed will not fight you. Bump SEED_VERSION only if you
   want a later cut re-applied on top of existing data.
   ============================================================ */
const SEED_VERSION = "2026-08-15";
const DEFAULT_HIDDEN = ["amazonpropel", "amphil", "bainbel", "bcggfl", "build4good", "cif", "deloitte", "duolingothrive_pm", "ey", "fti", "googleasdi", "ixl", "linkedinfirstplay", "mckinsey", "mckinseyssba", "msearlyinsights", "newsela", "nvidiaignite", "palantiraccel", "pfed", "salesforcelaunchpad", "spotify", "tcingc", "tfas", "uberstar", "upmc", "vanguardnorthstar"];

const STORAGE_KEY = "intern-tracker-data-v1";
function blankData() { return { statuses:{}, notes:{}, customOpps:[], edits:{}, hidden:[], seedVersion:null }; }
function normalize(d) {
  return {
    statuses: d.statuses || {},
    notes:    d.notes    || {},
    customOpps: d.customOpps || [],
    // edits: per-id partial overrides applied over ANY opportunity, built-in or yours.
    // Older backup files simply won't have this key, which is why it defaults empty
    // rather than failing the restore.
    edits:  d.edits  || {},
    hidden: Array.isArray(d.hidden) ? d.hidden : [],
    seedVersion: d.seedVersion || null,
  };
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const d = raw ? normalize(JSON.parse(raw)) : blankData();
    return applySeed(d);
  } catch (e) { return applySeed(blankData()); }
}
/* Union the cut into `hidden` exactly once, then remember that we did.
   Runs on a fresh browser AND on an existing one that predates the cut, which is
   why it is here rather than in blankData(). Restoring an old backup re-triggers
   it, which is the behaviour you want: the cut should survive a restore. */
function applySeed(d) {
  if (d.seedVersion === SEED_VERSION) return d;
  d.hidden = [ ...new Set([ ...(d.hidden || []), ...DEFAULT_HIDDEN ]) ];
  d.seedVersion = SEED_VERSION;
  saveData(d);
  return d;
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
  catch (e) { return false; }
}

/* Route a batch answer back to the right rows. Falls back to matching on organization
   name when the model drops or mangles an id, which it occasionally does. */
function parseBatch(text, list) {
  const obj = parseCheck(text);
  const arr = Array.isArray(obj) ? obj : (obj.results || obj.rows || []);
  if (!Array.isArray(arr) || !arr.length) throw new Error("No results array in that JSON.");
  const byId = {}, unmatched = [];
  arr.forEach(r => {
    let target = list.find(o => o.id === r.id);
    if (!target && r.org) {
      const norm = x => String(x).toLowerCase().replace(/[^a-z0-9]/g, "");
      target = list.find(o => norm(o.org) === norm(r.org))
            || list.find(o => norm(o.org).startsWith(norm(r.org).slice(0, 8)));
    }
    if (target) byId[target.id] = r; else unmatched.push(r.org || r.id || "(unnamed)");
  });
  return { byId, unmatched, skipped: obj.skipped || [] };
}

/* Pull the JSON back out. Models sometimes wrap it in fences or add a sentence
   despite being told not to, so take the outermost brace pair rather than trusting
   the whole string to parse. */
function parseCheck(text) {
  let t = (text || "").trim().replace(/^```(?:json)?/i, "").replace(/```$/,"").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a === -1 || b === -1) throw new Error("No JSON object in the response.");
  return JSON.parse(t.slice(a, b + 1));
}

async function runCheck(o, { key, model, signal }) {
  let messages = [{ role:"user", content: buildCheckPrompt(o) }];
  let searches = 0;

  for (let turn = 0; turn < 6; turn++) {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      signal,
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model,
        max_tokens: 3000,
        messages,
        tools: [{ type:"web_search_20250305", name:"web_search", max_uses: 6 }],
      }),
    });

    if (!res.ok) {
      let detail = "";
      try { const j = await res.json(); detail = (j.error && j.error.message) || ""; } catch(e){}
      if (res.status === 401) throw new Error("API key rejected. Check the key in Settings.");
      if (res.status === 429) throw new Error("Rate limited by the API. Wait a minute and retry.");
      if (res.status === 400 && /web search/i.test(detail))
        throw new Error("Web search is disabled for this API organization. Enable it in the Claude Console, or use the no-key path instead.");
      throw new Error(`API error ${res.status}. ${detail}`);
    }

    const data = await res.json();
    searches += (data.usage && data.usage.server_tool_use && data.usage.server_tool_use.web_search_requests) || 0;

    // A long search turn can be paused server-side; resend the assistant message unchanged.
    if (data.stop_reason === "pause_turn") {
      messages = [...messages, { role:"assistant", content: data.content }];
      continue;
    }

    const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
    const sources = [];
    (data.content || []).forEach(b => {
      if (b.type === "text" && Array.isArray(b.citations))
        b.citations.forEach(c => { if (c.url && !sources.some(x => x.url === c.url)) sources.push({ url:c.url, title:c.title }); });
    });
    const parsed = parseCheck(text);
    parsed._sources = sources;
    parsed._searches = searches;
    return parsed;
  }
  throw new Error("The model kept pausing without finishing. Try again, or use the no-key path.");
}

/* ---------- Runway: the next 240 days as one horizontal strip ----------
   Plots each opportunity by the date its application window OPENS, which is what
   the countdown badges key on. Anything already open, plus outreach targets with no
   window, sits at day 0. Lane-stacked so overlapping dates stay legible. Click a pip
   to jump to that card. */
const RUNWAY_DAYS = 240;
const PIP = {
  open:  "#3FD69A",
  d14:   "#FF6B57",
  d45:   "#FFB454",
  d90:   "#78A9FF",
  later: "#7C8798",
};
function pipColor(d) {
  if (d <= 0) return PIP.open;
  if (d <= 14) return PIP.d14;
  if (d <= 45) return PIP.d45;
  if (d <= 90) return PIP.d90;
  return PIP.later;
}

function Runway({ opps, onPick }) {
  const [hover, setHover] = useState(null);

  const live = opps.filter(o => confOf(o) !== "closed");

  // Anything already open, plus outreach targets with no window at all, is "at the gate".
  // Those don't belong on a timeline — they're all at zero — so they get their own block.
  const gate = live.filter(o => isOpenNow(o));
  const gateIds = new Set(gate.map(o => o.id));

  const pts = live
    .filter(o => !gateIds.has(o.id))
    .map(o => {
      const d = daysUntil(o.openDate);
      if (d === null || d > RUNWAY_DAYS) return null;
      return { o, d, est: confOf(o) === "estimate" };
    })
    .filter(Boolean)
    .sort((a, b) => a.d - b.d);

  // Lane assignment: left to right, first lane with room. Anything that still collides
  // after the last lane is folded into a "+N" marker rather than stacked off the panel.
  const LANES = 6, ROW = 11, MINGAP = 2.4;
  const laneEnd = new Array(LANES).fill(-99);
  const shown = [], overflow = [];
  pts.forEach(pt => {
    const x = (pt.d / RUNWAY_DAYS) * 100;
    const lane = laneEnd.findIndex(e => x - e > MINGAP);
    if (lane === -1) { overflow.push(pt); return; }
    laneEnd[lane] = x;
    pt.x = x; pt.lane = lane;
    shown.push(pt);
  });

  const months = [];
  for (let d = 30; d <= RUNWAY_DAYS - 20; d += 30) {
    const dt = new Date(); dt.setHours(0,0,0,0); dt.setDate(dt.getDate() + d);
    months.push({ d, label: dt.toLocaleDateString("en-US", { month:"short" }) });
  }

  const soon = pts.filter(p => p.d <= 14).length;
  const hoveredPt = hover === "__gate" ? null : pts.find(x => x.o.id === hover);

  return h("div", { className:"runway" },
    h("div", { className:"runway-head" },
      h("div", null,
        h("div", { className:"runway-eyebrow" }, "When each application window opens"),
        h("div", { className:"runway-title" }, "The next 240 days"),
      ),
      h("div", { className:"runway-nums" },
        h("div", { className:"runway-num" },
          h("span", { style:{ color:PIP.open } }, gate.length), h("small", null, "open today")),
        h("div", { className:"runway-num" },
          h("span", { style:{ color:PIP.d14 } }, soon), h("small", null, "opening \u2264 14d")),

/* ---------- the review screen: a diff you accept field by field ---------- */
function CheckPanel({ opp, state, onRun, onPaste, onApply, onDismiss, hasKey }) {
  const [manual, setManual] = useState("");
  const [showManual, setShowManual] = useState(false);
  const [picked, setPicked] = useState(null);

  const r = state && state.result;
  const changed = (k) => {
    const cur = k === "openDate" ? (opp.openDate || "") : (opp[k] || "");
    const nxt = r[k] == null ? "" : String(r[k]);
    return nxt !== "" && nxt !== String(cur);
  };
  const diffs = r ? CHECK_FIELDS.filter(f => changed(f.k)) : [];
  const sel = picked || diffs.reduce((a, f) => (a[f.k] = true, a), {});

  const copyPrompt = () => {
    const t = buildCheckPrompt(opp);
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(()=>{}, ()=>{});
    setShowManual(true);
  };

  const box = { background:"#F8F8F4", border:"1px solid #E1E0D7", borderRadius:"9px", padding:"11px 12px", marginBottom:"10px" };
  const lbl = { fontSize:"10px", fontWeight:"700", color:"#8C8F88", textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:"5px" };
  const btn = (primary) => ({
    fontFamily:"'IBM Plex Mono', monospace", fontSize:"10.5px", padding:"5px 11px", borderRadius:"7px",
    cursor:"pointer", border:"1px solid " + (primary ? "#191A16" : "#D2D1C6"),
    background: primary ? "#191A16" : "rgba(255,255,255,.7)", color: primary ? "#F5F4EE" : "#5C5F59",
  });

  return h("div", { style:box },
    h("div", { style:lbl }, "Verify dates with Claude"),

    !r && h("div", { style:{ display:"flex", gap:"6px", flexWrap:"wrap", alignItems:"center" } },
      h("button", { onClick:onRun, disabled:!hasKey || (state && state.loading), style:{ ...btn(true), opacity: hasKey ? 1 : .4 } },
        state && state.loading ? "Searching\u2026" : "Check with API"),
      h("button", { onClick:copyPrompt, style:btn(false) }, "Copy prompt"),
      h("button", { onClick:()=>setShowManual(!showManual), style:btn(false) }, "Paste result"),
      !hasKey && h("span", { style:{ fontSize:"10.5px", color:"#8C8F88" } }, "no API key set \u2014 use Copy prompt"),
    ),

    state && state.error && h("div", { style:{ marginTop:"8px", fontSize:"11.5px", color:"#A32D2D", background:"#FCEBEB", border:"1px solid #f0c0c0", borderRadius:"6px", padding:"7px 9px", lineHeight:"1.5" } }, state.error),

    showManual && !r && h("div", { style:{ marginTop:"9px" } },
      h("div", { style:{ fontSize:"11.5px", color:"#5C5F59", lineHeight:"1.55", marginBottom:"6px" } },
        "Prompt copied. Paste it into a Claude chat with web search turned on, then paste the JSON it returns here."),
      h("textarea", { value:manual, onChange:e=>setManual(e.target.value), placeholder:'{ "status": "found", ... }',
        style:{ width:"100%", minHeight:"70px", fontFamily:"'IBM Plex Mono', monospace", fontSize:"11px", padding:"7px 9px", border:"1px solid #D2D1C6", borderRadius:"6px", background:"#fff", resize:"vertical" } }),
      h("button", { onClick:()=>onPaste(manual), style:{ ...btn(true), marginTop:"6px" } }, "Load result"),
    ),

    r && h("div", null,
      h("div", { style:{ fontSize:"11.5px", color:"#5C5F59", lineHeight:"1.55", marginBottom:"9px" } },
        h("b", { style:{ fontWeight:"600", color:"#191A16" } },
          r.status === "found" ? "Found" : r.status === "closed" ? "Cycle closed" : "Nothing found"),
        r._searches ? ` \u00B7 ${r._searches} searches` : "",
        r.notes ? " \u00B7 " + r.notes : "",
      ),

      diffs.length === 0
        ? h("div", { style:{ fontSize:"11.5px", color:"#085041", background:"#E1F5EE", borderRadius:"6px", padding:"7px 9px", marginBottom:"9px" } },
            "No differences from what is already recorded. Confidence and last-checked can still be stamped below.")
        : diffs.map(f => h("label", { key:f.k, style:{ display:"block", marginBottom:"7px", cursor:"pointer" } },
            h("div", { style:{ display:"flex", gap:"7px", alignItems:"flex-start" } },
              h("input", { type:"checkbox", checked:!!sel[f.k], style:{ marginTop:"3px", flexShrink:0 },
                onChange:e => setPicked({ ...sel, [f.k]: e.target.checked }) }),
              h("div", { style:{ minWidth:0, flex:1 } },
                h("div", { style:{ fontSize:"10px", color:"#8C8F88", textTransform:"uppercase", letterSpacing:"0.05em" } }, f.label),
                h("div", { style:{ fontFamily:"'IBM Plex Mono', monospace", fontSize:"11px", color:"#A32D2D", textDecoration:"line-through", wordBreak:"break-word" } },
                  (f.k === "openDate" ? opp.openDate : opp[f.k]) || "(empty)"),
                h("div", { style:{ fontFamily:"'IBM Plex Mono', monospace", fontSize:"11px", color:"#085041", wordBreak:"break-word" } },
                  String(r[f.k])),
              ),
            ),
          )),

      Array.isArray(r.evidence) && r.evidence.length > 0 && h("div", { style:{ marginTop:"4px", marginBottom:"9px" } },
        h("div", { style:lbl }, "Evidence \u2014 check these before accepting"),
        r.evidence.slice(0, 6).map((e, i) => h("div", { key:i, style:{ fontSize:"11px", color:"#5C5F59", lineHeight:"1.5", marginBottom:"5px", borderLeft:"2px solid #E1E0D7", paddingLeft:"8px" } },
          h("div", null, e.claim),
          e.quote && h("div", { style:{ fontStyle:"italic", color:"#8C8F88" } }, "\u201C", e.quote, "\u201D"),
          e.url && h("a", { href:e.url, target:"_blank", rel:"noopener noreferrer",
            style:{ fontFamily:"'IBM Plex Mono', monospace", fontSize:"10px", color:"#185FA5", wordBreak:"break-all" } }, e.url),
        )),
      ),

      h("div", { style:{ display:"flex", gap:"6px", flexWrap:"wrap" } },
        h("button", { onClick:()=>onApply(sel, r), style:btn(true) },
          diffs.length ? "Apply selected" : "Stamp as checked"),
        h("button", { onClick:onDismiss, style:btn(false) }, "Discard"),
      ),
    ),
  );
}

/* ---------- Add / Edit Opportunity form ----------
   One form, two jobs. `initial` empty = adding. `initial` populated = editing an
   existing row, built-in or yours. Editing a built-in writes a partial override
   into data.edits[id] rather than touching the OPPS list, so the file stays the
   source of truth and your changes survive an update to it. */
function OppForm({ onAdd, onCancel, initial, mode }) {
  const isEdit = mode === "edit";
  const [f, setF] = useState({
    org:"", role:"", tier:2, cats:[], loc:"", comp:"", dur:"",
    openDate:"", appWin:"", dl:"", link:"", searchLink:"", roleTitle:"", conf:"estimate", angle:"", eligNote:"", urgent:false,
    ...(initial || {}),
    openDate: (initial && initial.openDate) || "",
    cats: (initial && initial.cats ? initial.cats.filter(c => c !== "custom") : []),
  });
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const toggleCat = (c) => setF(prev => ({
    ...prev,
    cats: prev.cats.includes(c) ? prev.cats.filter(x => x !== c) : [...prev.cats, c],
  }));

  const submit = () => {
    if (!f.org.trim() || !f.role.trim()) { alert("Organization and role are required."); return; }
    const id = isEdit ? initial.id : ("custom-" + Date.now());
    onAdd({
      id, org:f.org.trim(), role:f.role.trim(), tier:Number(f.tier),
      cats: f.cats.length ? [...f.cats, "custom"] : ["custom"],
      loc: f.loc.trim() || "—", comp: f.comp.trim() || "—", dur: f.dur.trim() || "—",
      openDate: f.openDate || null,
      appWin: f.appWin.trim() || (f.openDate ? new Date(f.openDate).toLocaleDateString("en-US",{month:"short",year:"numeric"}) : "TBD"),
      dl: f.dl.trim() || "TBD",
      link: f.link.trim(), searchLink: f.searchLink.trim(), roleTitle: f.roleTitle.trim(),
      conf: f.conf, checked: new Date().toISOString().slice(0,10),
      angle: f.angle.trim(), eligNote: (f.eligNote || "").trim(), urgent: f.urgent,
      custom: isEdit ? !!initial.custom : true,
    }, isEdit);
  };

  const inputStyle = { width:"100%", fontSize:"13px", padding:"7px 9px", border:"1px solid #d0cfc9", borderRadius:"6px", background:"#fff", color:"#1c1c1a", boxSizing:"border-box", fontFamily:"inherit" };
  const labelStyle = { fontSize:"10px", fontWeight:"600", color:"#8c8c88", textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:"3px", display:"block" };
  const field = (label, node) => h("div", { style:{ marginBottom:"10px" } }, h("label", { style:labelStyle }, label), node);

  return h("div", { style:{ border:"1px solid #d0cfc9", borderRadius:"8px", padding:"14px", marginBottom:"14px", background:"#fff" } },
    h("div", { style:{ fontSize:"13px", fontWeight:"600", marginBottom:"12px", color:"#1c1c1a" } },
      isEdit ? ("Edit \u2014 " + (initial.org || "opportunity")) : "Add your own opportunity"),
    isEdit && h("div", { style:{ fontSize:"11px", color:"#6b6b67", background:"#f4f3ef", borderRadius:"6px", padding:"7px 9px", marginBottom:"12px", lineHeight:"1.5" } },
      "Saving overwrites only the fields you change. Your status and notes are untouched. Use \u201CRevert\u201D on the card to drop your edits and go back to the built-in version."),
    h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px" } },
      field("Organization *", h("input", { style:inputStyle, value:f.org, onChange:e=>set("org", e.target.value), placeholder:"e.g. Notion" })),
      field("Role / title *", h("input", { style:inputStyle, value:f.role, onChange:e=>set("role", e.target.value), placeholder:"e.g. Product intern" })),
    ),
    h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"10px" } },
      field("Location", h("input", { style:inputStyle, value:f.loc, onChange:e=>set("loc", e.target.value), placeholder:"Remote / city" })),
      field("Compensation", h("input", { style:inputStyle, value:f.comp, onChange:e=>set("comp", e.target.value), placeholder:"$/hr or N/A" })),
      field("Duration", h("input", { style:inputStyle, value:f.dur, onChange:e=>set("dur", e.target.value), placeholder:"10 weeks" })),
    ),
    h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"10px" } },
      field("Opens on (date, optional)", h("input", { type:"date", style:inputStyle, value:f.openDate, onChange:e=>set("openDate", e.target.value) })),
      field("Opens (label text)", h("input", { style:inputStyle, value:f.appWin, onChange:e=>set("appWin", e.target.value), placeholder:"e.g. Rolling" })),
      field("Deadline (text)", h("input", { style:inputStyle, value:f.dl, onChange:e=>set("dl", e.target.value), placeholder:"e.g. Mar 1, 2027" })),
    ),
    field("Tier", h("select", { style:inputStyle, value:f.tier, onChange:e=>set("tier", e.target.value) },
      h("option", { value:1 }, "Tier 1 — mission-aligned"),
      h("option", { value:2 }, "Tier 2 — strong fit"),
      h("option", { value:3 }, "Tier 3 — worth watching"),
    )),
    field("Categories", h("div", { style:{ display:"flex", flexWrap:"wrap", gap:"6px" } },
      ALL_CAT_OPTIONS.map(c => {
        const on = f.cats.includes(c);
        const b = CB[c];
        return h("button", {
          key:c, type:"button", onClick:()=>toggleCat(c),
          style:{ fontSize:"11px", padding:"3px 9px", borderRadius:"20px", cursor:"pointer",
                  border: on ? "1px solid transparent" : "1px solid #d0cfc9",
                  background: on ? b.bg : "transparent", color: on ? b.fg : "#8c8c88", fontWeight:"500" },
        }, b.label);
      })
    )),
    field("How solid is that date?", h("select", { style:inputStyle, value:f.conf, onChange:e=>set("conf", e.target.value) },
      h("option", { value:"confirmed" }, "Confirmed — I read it on the employer's page today"),
      h("option", { value:"estimate" }, "Estimate — guessed from prior cycles"),
      h("option", { value:"closed" }, "Closed — this cycle's window has passed"),
    )),
    field("Exact posting title to apply to", h("input", { style:inputStyle, value:f.roleTitle, onChange:e=>set("roleTitle", e.target.value), placeholder:"Paste the posting's exact title + any eligibility gotcha" })),
    field("Direct link (specific posting or program page)", h("input", { style:inputStyle, value:f.link, onChange:e=>set("link", e.target.value), placeholder:"https://..." })),
    field("Fallback search link (survives posting rotation)", h("input", { style:inputStyle, value:f.searchLink, onChange:e=>set("searchLink", e.target.value), placeholder:"https://... their job search, pre-filtered" })),
    field("Your angle", h("textarea", { style:{...inputStyle, minHeight:"60px", resize:"vertical"}, value:f.angle, onChange:e=>set("angle", e.target.value), placeholder:"Why this is worth pursuing, contacts, next steps..." })),
    field("Eligibility / caution note", h("textarea", { style:{...inputStyle, minHeight:"60px", resize:"vertical"}, value:f.eligNote, onChange:e=>set("eligNote", e.target.value), placeholder:"Graduation-year rules, restrictions, what to verify before applying..." })),
    h("label", { style:{ fontSize:"12px", color:"#6b6b67", display:"flex", alignItems:"center", gap:"6px", marginBottom:"12px", cursor:"pointer" } },
      h("input", { type:"checkbox", checked:f.urgent, onChange:e=>set("urgent", e.target.checked) }),
      "No fixed deadline — needs direct outreach (flags as \"act now\")"
    ),
    h("div", { style:{ display:"flex", gap:"8px" } },
      h("button", { onClick:submit, style:{ fontSize:"12px", fontWeight:"600", padding:"7px 14px", borderRadius:"20px", border:"none", background:"#1c1c1a", color:"#fff", cursor:"pointer" } }, isEdit ? "Save changes" : "Add to tracker"),
      h("button", { onClick:onCancel, style:{ fontSize:"12px", padding:"7px 14px", borderRadius:"20px", border:"1px solid #d0cfc9", background:"transparent", color:"#6b6b67", cursor:"pointer" } }, "Cancel"),
    )
  );
}

/* ---------- main App ---------- */
function App() {
  const ref = useRef({ statuses:{}, notes:{}, customOpps:[] });
  const [statuses, setStatuses] = useState({});
  const [notes, setNotes] = useState({});
  const [customOpps, setCustomOpps] = useState([]);
  const [edits, setEdits] = useState({});
  const [hidden, setHidden] = useState([]);
  const [cat, setCat] = useState("all");
  const [tierF, setTierF] = useState("all");
  const [expanded, setExpanded] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [showHidden, setShowHidden] = useState(false);
  const [checks, setChecks] = useState({});          // id -> {loading, error, result}
  const [apiKey, setApiKeyState] = useState("");
  const [model, setModelState] = useState(MODELS[0].id);
  const [showSettings, setShowSettings] = useState(false);
  const [batch, setBatch] = useState(null);          // {done, total, current} while sweeping
  const [chunkSize, setChunkSize] = useState(6);
  const [chunkIdx, setChunkIdx] = useState(0);
  const [bulkText, setBulkText] = useState("");
  const [bulkMsg, setBulkMsg] = useState("");
  const [copied, setCopied] = useState(false);
  const abortRef = useRef(null);
  const [msg, setMsg] = useState("");
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    const d = loadData();
    ref.current = d;
    setStatuses({ ...d.statuses });
    setNotes({ ...d.notes });
    setCustomOpps([ ...d.customOpps ]);
    setEdits({ ...d.edits });
    setHidden([ ...d.hidden ]);
    setApiKeyState(getKey());
    setModelState(getModel());
    setLoaded(true);
  }, []);

  const persist = () => {
    const ok = saveData(ref.current);
    setMsg(ok ? "saved" : "save failed — check browser storage settings");
    setTimeout(() => setMsg(""), 1500);
  };

  const setStatus = (id, v) => {
    ref.current.statuses = { ...ref.current.statuses, [id]: v };
    setStatuses({ ...ref.current.statuses });
    persist();
  };
  const setNote = (id, v) => {
    ref.current.notes = { ...ref.current.notes, [id]: v };
    setNotes({ ...ref.current.notes });
  };
  const addOpp = (opp, isEdit) => {
    if (isEdit) {
      // Overrides are stored separately from the built-in list, keyed by id.
      ref.current.edits = { ...ref.current.edits, [opp.id]: opp };
      setEdits({ ...ref.current.edits });
      persist();
      setEditingId(null);
      return;
    }
    ref.current.customOpps = [ ...ref.current.customOpps, opp ];
    setCustomOpps([ ...ref.current.customOpps ]);
    persist();
    setShowForm(false);
  };
  const revertOpp = (id) => {
    if (!confirm("Discard your edits to this entry and go back to the built-in version? Status and notes are kept.")) return;
    const next = { ...ref.current.edits };
    delete next[id];
    ref.current.edits = next;
    setEdits({ ...next });
    persist();
  };
  const hideOpp = (id) => {
    if (!confirm("Archive this entry? It stays in your data and can be brought back from \u201CShow archived\u201D.")) return;
    ref.current.hidden = [ ...new Set([ ...ref.current.hidden, id ]) ];
    setHidden([ ...ref.current.hidden ]);
    persist();
    if (expanded === id) setExpanded(null);
  };
  const unhideOpp = (id) => {
    ref.current.hidden = ref.current.hidden.filter(x => x !== id);
    setHidden([ ...ref.current.hidden ]);
    persist();
  };
  const deleteOpp = (id) => {
    if (!confirm("Remove this opportunity you added?")) return;
    ref.current.customOpps = ref.current.customOpps.filter(o => o.id !== id);
    setCustomOpps([ ...ref.current.customOpps ]);
    persist();
    if (expanded === id) setExpanded(null);
  };

  /* ---------- date verification ---------- */
  const setCheck = (id, v) => setChecks(prev => ({ ...prev, [id]: v }));

  const runOne = async (o, signal) => {
    setCheck(o.id, { loading:true });
    try {
      const result = await runCheck(o, { key: getKey(), model: getModel(), signal });
      setCheck(o.id, { result });
      return true;
    } catch (e) {
      if (e.name === "AbortError") { setCheck(o.id, null); return false; }
      setCheck(o.id, { error: e.message || String(e) });
      return false;
    }
  };

  const pasteResult = (id, text) => {
    try { setCheck(id, { result: parseCheck(text) }); }
    catch (e) { setCheck(id, { error: "That didn't parse as JSON. Paste the whole object, braces included." }); }
  };

  /* Applying writes into the same edits overlay as a manual edit, so it is revertable
     and carries no special status. The provenance line is appended rather than
     replacing your notes. */
  const applyCheck = (o, sel, r) => {
    const patch = {};
    CHECK_FIELDS.forEach(f => { if (sel[f.k] && r[f.k] != null && r[f.k] !== "") patch[f.k] = r[f.k]; });
    if (patch.openDate && !/^\d{4}-\d{2}-\d{2}$/.test(patch.openDate)) delete patch.openDate;
    patch.checked = new Date().toISOString().slice(0,10);
    if (!patch.conf && r.conf) patch.conf = r.conf;
    const merged = { ...o, ...patch };
    delete merged.edited;
    addOpp(merged, true);
    const stamp = `[${patch.checked}] Verified with Claude (${getModel()}). Status: ${r.status}.`
      + (Array.isArray(r._sources) && r._sources.length ? " Sources: " + r._sources.slice(0,3).map(x=>x.url).join(" ") : "")
      + (Array.isArray(r.evidence) && r.evidence.length && !(r._sources||[]).length ? " Sources: " + r.evidence.map(e=>e.url).filter(Boolean).slice(0,3).join(" ") : "");
    const prior = ref.current.notes[o.id] || "";
    ref.current.notes = { ...ref.current.notes, [o.id]: (prior ? prior + "\n\n" : "") + stamp };
    setNotes({ ...ref.current.notes });
    persist();                       // addOpp persisted the edit; the note needs its own save
    setCheck(o.id, null);
  };

  /* ---------- batched no-key path ---------- */
  const copyChunk = () => {
    const text = buildBatchPrompt(curChunk);
    const done = () => { setCopied(true); setTimeout(()=>setCopied(false), 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => { window.prompt("Copy this prompt:", text); });
    } else { window.prompt("Copy this prompt:", text); }
  };

  const loadBulk = () => {
    try {
      const { byId, unmatched, skipped } = parseBatch(bulkText, allOpps);
      const ids = Object.keys(byId);
      if (!ids.length) { setBulkMsg("Parsed, but none of the rows matched anything in the tracker."); return; }
      setChecks(prev => {
        const next = { ...prev };
        ids.forEach(id => { next[id] = { result: byId[id] }; });
        return next;
      });
      setBulkText("");
      setBulkMsg(`Loaded ${ids.length} ${ids.length === 1 ? "result" : "results"} into the review queue.`

        h("div", null,
          h("div", { style:{ fontSize:"10px", fontWeight:"700", color:"#8C8F88", textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:"3px" } }, "Model"),
          h("select", { value:model, onChange:e=>{ setModelState(e.target.value); setModel(e.target.value); },
            style:{ width:"100%", fontFamily:"'IBM Plex Mono', monospace", fontSize:"11px", padding:"7px 9px", border:"1px solid #D2D1C6", borderRadius:"6px", background:"#fff" } },
            MODELS.map(m => h("option", { key:m.id, value:m.id }, m.label))),
        ),
      ),
      apiKey && h("div", { style:{ marginTop:"12px", display:"flex", gap:"8px", alignItems:"center", flexWrap:"wrap" } },
        h("button", { onClick:runBatch, disabled:!!batch,
          style:{ fontFamily:"'IBM Plex Mono', monospace", fontSize:"10.5px", padding:"6px 12px", borderRadius:"7px", border:"1px solid #191A16", background: batch ? "#8C8F88" : "#191A16", color:"#F5F4EE", cursor: batch ? "default" : "pointer" } },
          batch ? `Checking ${batch.done + 1}/${batch.total} \u2014 ${batch.current}` : `Check all ${rows.length} visible rows`),
        batch && h("button", { onClick:()=>{ if (abortRef.current) abortRef.current.abort(); },
          style:{ fontFamily:"'IBM Plex Mono', monospace", fontSize:"10.5px", padding:"6px 12px", borderRadius:"7px", border:"1px solid #f0c0c0", background:"transparent", color:"#A32D2D", cursor:"pointer" } }, "Stop"),
        !batch && h("span", { style:{ fontSize:"11px", color:"#8C8F88" } },
          "Filter the list first \u2014 sweeping \u201COpen now\u201D or \u201CAct now\u201D is far cheaper than all 66."),
      ),
    ),

    h(Runway, { opps: allOpps, onPick: pickFromRunway }),

    h("div", { className:"stats" },
      [
        { n: allOpps.length, label:"total", c:"#1c1c1a", f:"all" },
        { n: openN, label:"open now", c:"#0B7A55", f:"opennow" },
        { n: actN, label:"act now", c:"#A8402B", f:"actnow" },
        { n: cnt("Researching","In progress"), label:"in progress", c:"#185FA5", f:null },
        { n: cnt("Applied","Waiting","Offer","Accepted"), label:"applied", c:"#534AB7", f:null },
      ].map(s => h("button", {
          key:s.label,
          className:"stat" + (s.f && cat === s.f ? " on" : "") + (s.f ? " clickable" : ""),
          onClick: s.f ? () => setCat(cat === s.f ? "all" : s.f) : undefined,
          title: s.f ? "Filter the list to these" : undefined,
        },
        h("span", { className:"stat-n", style:{ color:s.c } }, s.n),
        h("span", { className:"stat-l" }, s.label),
      ))
    ),

    h("div", { style:{ display:"flex", alignItems:"center", gap:"4px", flexWrap:"wrap", marginBottom:"6px" } },
      CATS.map(c => h("button", { key:c.id, onClick:()=>setCat(c.id), style:pill(cat===c.id) }, c.label)),
      pendingIds.length > 0 && h("button", { onClick:()=>setCat(cat === "review" ? "all" : "review"),
        style:{ ...pill(cat === "review"), borderColor: cat === "review" ? "#191A16" : "#BA7517",
                color: cat === "review" ? "#F5F4EE" : "#633806",
                background: cat === "review" ? "#191A16" : "rgba(250,238,218,.85)" } },
        `Review queue (${pendingIds.length})`),
      h("div", { style:{ marginLeft:"auto", display:"flex", gap:"4px" } },
        [["all","All"],["1","T1"],["2","T2"],["3","T3"]].map(([id,label]) =>
          h("button", { key:id, onClick:()=>setTierF(id), style:{...pill(tierF===id), fontSize:"11px", padding:"3px 8px"} }, label)
        )
      )
    ),

    h("div", { style:{ margin:"8px 0 14px" } },
      !showForm
        ? h("button", { onClick:()=>setShowForm(true),
            style:{ fontSize:"12px", fontWeight:"600", padding:"7px 14px", borderRadius:"20px", border:"1px dashed #185FA5", background:"#E6F1FB", color:"#0C447C", cursor:"pointer", display:"inline-flex", alignItems:"center", gap:"5px" } },
            h(IPlus, { size:11, color:"#0C447C" }), "Add your own opportunity"
          )
        : h(OppForm, { onAdd:addOpp, onCancel:()=>setShowForm(false), mode:"add" })
    ),

    h("p", { style:{ fontSize:"12px", color:"#8c8c88", margin:"0 0 0.75rem" } },
      `${rows.length}/${allOpps.length} shown · click any row for details + notes${msg ? " · " + msg : ""}`
    ),

    [1,2,3].map(t => {
      const tRows = rows.filter(o => o.tier === t);
      if (!tRows.length) return null;
      return h("div", { key:t },
        h("p", { className:"tier-head" }, TL[t]),
        tRows.map(o => {
          const status = statuses[o.id] || "Not started";
          const note = notes[o.id] || "";
          const isExp = expanded === o.id;
          const st = SS[status] || SS["Not started"];
          const cd = countdownBadge(o);
          return h("div", { key:o.id, id:"opp-"+o.id, className:"card" + (isExp ? " open" : ""),
            style:{ borderLeft:`3px solid ${TC[t]}` } },
            h("div", { onClick:()=>setExpanded(isExp?null:o.id), style:{ display:"flex", alignItems:"center", gap:"9px", padding:"12px 14px", cursor:"pointer" } },
              h("div", { style:{ flex:1, minWidth:0 } },
                h("div", { style:{ display:"flex", alignItems:"center", gap:"5px", marginBottom:"2px" } },
                  h("span", { style:{ fontWeight:"600", fontSize:"14.5px", letterSpacing:"-.012em", color:"#191A16", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" } }, o.org),
                  o.eligNote && h(IWarn, { size:12, color:"#BA7517" }),
                  o.custom && h("span", { style:{ fontSize:"9px", padding:"1px 6px", borderRadius:"20px", background:CB.custom.bg, color:CB.custom.fg, fontWeight:"600", flexShrink:0 } }, "yours"),
                  o.edited && h("span", { title:"You've edited this entry.", style:{ fontSize:"9px", padding:"1px 6px", borderRadius:"20px", background:"#E6F1FB", color:"#0C447C", fontWeight:"600", flexShrink:0 } }, "edited"),
                  checks[o.id] && checks[o.id].result && h("span", { title:"A date check is waiting for your review. Open this row.",
                    style:{ fontSize:"9px", padding:"1px 6px", borderRadius:"20px", background:"#FAEEDA", color:"#633806", fontWeight:"600", flexShrink:0 } }, "check ready"),
                  NEW_IDS.has(o.id) && h("span", { title:"Added in the Aug 14, 2026 sophomore-programs research pass.", style:{ fontSize:"9px", padding:"1px 6px", borderRadius:"20px", background:"#EAF3DE", color:"#173404", fontWeight:"600", flexShrink:0 } }, "new"),
                ),
                h("div", { style:{ fontSize:"12.5px", color:"#5C5F59", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", lineHeight:"1.4" } }, o.role),
              ),
              h("span", { style:{ fontFamily:"'IBM Plex Mono', monospace", fontSize:"10.5px", fontWeight:"600", padding:"3px 9px", borderRadius:"6px", background:cd.bg, color:cd.fg, flexShrink:0, whiteSpace:"nowrap" } }, cd.label),
              h("select", { value:status, onChange:e=>{e.stopPropagation(); setStatus(o.id, e.target.value);}, onClick:e=>e.stopPropagation(),
                style:{ fontSize:"11px", padding:"3px 6px", border:`1px solid ${st.fg}55`, borderRadius:"20px", cursor:"pointer", background:st.bg, color:st.fg, fontWeight:"600", flexShrink:0, maxWidth:"108px", fontFamily:"inherit" } },
                STATUSES.map(s => h("option", { key:s, value:s }, s))
              ),
              isExp ? h(IChevUp, { size:14 }) : h(IChevDown, { size:14 }),
            ),
            isExp && editingId === o.id && h("div", { style:{ borderTop:"1px solid #e0dfd9", padding:"12px 14px" } },
              h(OppForm, { onAdd:addOpp, onCancel:()=>setEditingId(null), initial:o, mode:"edit" })
            ),
            isExp && editingId !== o.id && h("div", { style:{ borderTop:"1px solid #e0dfd9", padding:"12px 14px" } },
              o.eligNote && h("div", { style:{ background:"#FAEEDA", borderRadius:"6px", padding:"8px 10px", marginBottom:"10px", fontSize:"12px", color:"#633806", lineHeight:"1.5", display:"flex", gap:"6px" } },
                h(IWarn, { size:13, color:"#633806", style:{ marginTop:"1px", flexShrink:0 } }),
                h("span", null, o.eligNote)
              ),
              h("div", { style:{ display:"flex", flexWrap:"wrap", gap:"12px", marginBottom:"8px" } },
                h("span", { style:{ fontSize:"12px", color:"#6b6b67", display:"flex", alignItems:"center", gap:"3px" } }, h(IPin,{size:11}), o.loc),
                h("span", { style:{ fontSize:"12px", color:"#6b6b67", display:"flex", alignItems:"center", gap:"3px" } }, h(IClock,{size:11}), o.dur),
                h("span", { style:{ fontSize:"12px", color:"#6b6b67", display:"flex", alignItems:"center", gap:"3px" } }, h(IDollar,{size:11}), o.comp),
              ),
              h("div", { style:{ display:"flex", flexWrap:"wrap", alignItems:"center", gap:"12px", marginBottom:"6px" } },
                h("span", { style:{ fontSize:"12px", color:"#6b6b67", display:"flex", alignItems:"center", gap:"3px" } }, h(ICal,{size:11}), h("b",{style:{fontWeight:"600"}},"Opens:")," ",o.appWin),
                h("span", { style:{ fontSize:"12px", color:"#6b6b67", display:"flex", alignItems:"center", gap:"3px" } }, h(ICal,{size:11}), h("b",{style:{fontWeight:"600"}},"Deadline:")," ",o.dl),
                (() => { const cm = CONF_META[confOf(o)]; return h("span", { title:cm.tip,
                  style:{ fontSize:"10px", fontWeight:"700", padding:"1px 7px", borderRadius:"20px", background:cm.bg, color:cm.fg, letterSpacing:"0.03em", cursor:"help",
                          border: confOf(o)==="estimate" ? "1px dashed "+cm.fg+"66" : "1px solid transparent" } }, cm.label); })(),
                (() => { const em = EFFORT_META[effortOf(o)]; return h("span", { title:em.tip,
                  style:{ fontSize:"10px", fontWeight:"700", padding:"1px 7px", borderRadius:"20px", background:em.bg, color:em.fg, letterSpacing:"0.03em", cursor:"help" } }, em.label); })(),
                (() => { const ls = linkState(o.link); if (!ls) return null; return h("span", { title:ls.tip,
                  style:{ fontSize:"10px", fontWeight:"700", padding:"1px 7px", borderRadius:"20px", background:ls.bg, color:ls.fg, letterSpacing:"0.03em", cursor:"help" } }, ls.label); })(),
                /* The fallback URL gets its own badge only when its state is worse than the
                   primary's. Workiva is the case that made this necessary: the program link
                   is fine while the Workday board behind it has been 500ing, and collapsing
                   both into one badge hid that. */
                (() => {
                  const a = linkState(o.link), b2 = linkState(o.searchLink);
                  if (!b2 || !o.searchLink || o.searchLink === o.link) return null;
                  const rank = { ok:0, blocked:1, down:2, unchecked:1 };
                  if (!a || rank[b2.s] <= rank[a.s]) return null;
                  return h("span", { title:"Applies to the fallback / search link, not the primary one. " + b2.tip,
                    style:{ fontSize:"10px", fontWeight:"700", padding:"1px 7px", borderRadius:"20px", background:b2.bg, color:b2.fg, letterSpacing:"0.03em", cursor:"help" } },
                    "fallback: " + b2.label); })(),
              ),
              h("div", { style:{ fontSize:"11px", color:"#8c8c88", marginBottom:"10px", lineHeight:"1.5" } },
                CONF_META[confOf(o)].tip,
                o.checked ? ` · Last checked ${o.checked}.` : " · Never verified against a live source.",
              ),

              o.roleTitle && h("div", { style:{ background:"#f4f3ef", border:"1px solid #e0dfd9", borderRadius:"6px", padding:"8px 10px", marginBottom:"10px" } },
                h("div", { style:{ fontSize:"10px", fontWeight:"700", color:"#8c8c88", textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:"3px" } }, "Exact posting to apply to"),
                h("div", { style:{ fontSize:"12px", color:"#1c1c1a", lineHeight:"1.5", fontFamily:"ui-monospace, SFMono-Regular, Menlo, monospace" } }, o.roleTitle),
              ),
              h("div", { style:{ display:"flex", gap:"4px", flexWrap:"wrap", marginBottom:"10px" } },
                o.cats.map(c => { const b = CB[c] || { bg:"#F1EFE8", fg:"#444", label:c }; return h("span", { key:c, style:{ fontSize:"11px", padding:"2px 8px", borderRadius:"20px", background:b.bg, color:b.fg, fontWeight:"500" } }, b.label); })
              ),
              o.angle && h("div", { style:{ marginBottom:"10px" } },
                h("div", { style:{ fontSize:"10px", fontWeight:"700", color:"#8c8c88", textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:"4px" } }, "Your angle"),
                h("div", { style:{ fontSize:"13px", color:"#1c1c1a", lineHeight:"1.6" } }, o.angle),
              ),
              h("div", { style:{ marginBottom:"10px", display:"flex", justifyContent:"space-between", alignItems:"center", gap:"10px", flexWrap:"wrap" } },
                h("span", { style:{ display:"inline-flex", alignItems:"center", gap:"14px", flexWrap:"wrap" } },
                  o.link && h("a", { href:o.link, target:"_blank", rel:"noopener noreferrer",
                    style:{ fontSize:"12px", fontWeight:"600", color:"#185FA5", textDecoration:"none", display:"inline-flex", alignItems:"center", gap:"4px" } },
                    h(ILink,{size:12,color:"#185FA5"}), confOf(o)==="confirmed" ? "Go to posting" : "Program page"),
                  o.searchLink && o.searchLink !== o.link && h("a", { href:o.searchLink, target:"_blank", rel:"noopener noreferrer",
                    title:"Use this if the direct link is dead — postings rotate between cycles.",
                    style:{ fontSize:"12px", color:"#6b6b67", textDecoration:"none", display:"inline-flex", alignItems:"center", gap:"4px" } },
                    h(ILink,{size:12,color:"#6b6b67"}), "Search all postings"),
                ),
                h("span", { style:{ display:"inline-flex", gap:"6px", flexWrap:"wrap" } },
                  h("button", { onClick:()=>setEditingId(o.id), style:{ fontSize:"11px", color:"#0C447C", background:"#E6F1FB", border:"1px solid #b9d3ee", borderRadius:"20px", padding:"3px 10px", cursor:"pointer", fontWeight:"600" } }, "Edit this entry"),
                  o.edited && h("button", { onClick:()=>revertOpp(o.id), title:"Drop your edits, keep status and notes.",
                    style:{ fontSize:"11px", color:"#6b6b67", background:"transparent", border:"1px solid #d0cfc9", borderRadius:"20px", padding:"3px 10px", cursor:"pointer" } }, "Revert"),
                  h("button", { onClick:()=>hideOpp(o.id), title:"Move out of the main list without deleting.",
                    style:{ fontSize:"11px", color:"#6b6b67", background:"transparent", border:"1px solid #d0cfc9", borderRadius:"20px", padding:"3px 10px", cursor:"pointer" } }, "Archive"),
                  o.custom && h("button", { onClick:()=>deleteOpp(o.id), style:{ fontSize:"11px", color:"#A32D2D", background:"transparent", border:"1px solid #f0c0c0", borderRadius:"20px", padding:"3px 10px", cursor:"pointer", display:"inline-flex", alignItems:"center", gap:"4px" } }, h(ITrash,{size:10,color:"#A32D2D"}), "Remove"),
                ),
              ),
              h(CheckPanel, {
                opp:o, state:checks[o.id], hasKey:!!apiKey,
                onRun:()=>runOne(o),
                onPaste:(t)=>pasteResult(o.id, t),
                onApply:(sel, r)=>applyCheck(o, sel, r),
                onDismiss:()=>setCheck(o.id, null),
              }),

              h("div", null,
                h("div", { style:{ fontSize:"10px", fontWeight:"700", color:"#8c8c88", textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:"4px" } }, "Notes"),
                h("textarea", { value:note, onChange:e=>setNote(o.id, e.target.value), onBlur:persist,
                  placeholder:"Contacts, next steps, interview notes, key dates...",
                  style:{ width:"100%", minHeight:"60px", fontSize:"13px", padding:"8px 10px", border:"1px solid #d0cfc9", borderRadius:"6px", background:"#f8f7f3", color:"#1c1c1a", resize:"vertical", boxSizing:"border-box", fontFamily:"inherit", lineHeight:"1.5" } }),
              )
            )
          );
        })
      );
    }),

    archived.length > 0 && h("div", null,
      h("button", { onClick:()=>setShowHidden(!showHidden),
        style:{ fontSize:"11px", fontWeight:"700", letterSpacing:"0.05em", color:"#8c8c88", textTransform:"uppercase", background:"transparent", border:"none", padding:"0", margin:"1.5rem 0 6px", cursor:"pointer" } },
        (showHidden ? "\u25B4 " : "\u25BE ") + "Archived (" + archived.length + ")"),
      showHidden && archived.map(o => h("div", { key:o.id, style:{ borderRadius:"8px", border:"1px dashed #d0cfc9", padding:"8px 12px", marginBottom:"6px", background:"#f8f7f3", display:"flex", alignItems:"center", gap:"10px" } },
        h("div", { style:{ flex:1, minWidth:0 } },
          h("div", { style:{ fontSize:"13px", fontWeight:"600" } }, o.org),
          h("div", { style:{ fontSize:"12px", color:"#8c8c88", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" } }, o.role),
        ),
        h("button", { onClick:()=>unhideOpp(o.id), style:{ fontSize:"11px", color:"#0C447C", background:"#E6F1FB", border:"1px solid #b9d3ee", borderRadius:"20px", padding:"3px 10px", cursor:"pointer", flexShrink:0 } }, "Restore"),
      ))
    ),

    h("p", { className:"tier-head" }, "Watching for 2028 (junior year cycle)"),
    WATCHLIST.map(w => h("div", { key:w.id, style:{ borderRadius:"8px", border:"1px dashed #d0cfc9", padding:"10px 12px", marginBottom:"8px", background:"#f8f7f3" } },
      h("div", { style:{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:"8px", marginBottom:"4px" } },
        h("span", { style:{ fontWeight:"600", fontSize:"13px", color:"#1c1c1a" } }, w.org),
        h("a", { href:w.link, target:"_blank", rel:"noopener noreferrer", style:{ fontSize:"11px", color:"#185FA5", textDecoration:"none", display:"inline-flex", alignItems:"center", gap:"3px", flexShrink:0 } }, h(ILink,{size:11,color:"#185FA5"}), "link"),
      ),
      h("div", { style:{ fontSize:"12px", color:"#6b6b67", marginBottom:"4px" } }, w.role),
      h("div", { style:{ fontSize:"12px", color:"#8c8c88", lineHeight:"1.5" } }, w.why),
    )),

    h("p", { style:{ fontFamily:"'IBM Plex Mono', monospace", fontSize:"10px", lineHeight:"1.7", color:"#8C8F88", marginTop:"2rem", borderTop:"1px solid #E1E0D7", paddingTop:"14px" } },
      `${allOpps.length} live opportunities (${OPPS.length} built-in + ${customOpps.length} yours${archived.length ? ", " + archived.length + " archived" : ""}) · `
      + `${Object.keys(edits).length} edited by you · Links last checked ${LINKCHECK_DATE}. `
      + `Saved to this browser's storage — download a backup periodically, because clearing browser data or switching devices will not carry your statuses, notes and edits over.`
    ),
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
