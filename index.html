/* ---------- date helpers ---------- */
function daysUntil(d) {
  if (!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.ceil((new Date(d) - t) / 86400000);
}
function countdownBadge(o) {
  if (o.urgent && !o.openDate) return { label:"outreach now", bg:"#FAEEDA", fg:"#633806" };
  const d = daysUntil(o.openDate);
  if (d === null) return { label: o.appWin || "—", bg:"#F1EFE8", fg:"#6b6b67" };
  if (d <= 0)  return { label:"open now", bg:"#E1F5EE", fg:"#085041" };
  if (d <= 14) return { label:`${d}d`, bg:"#FCEBEB", fg:"#A32D2D" };
  if (d <= 45) return { label:`${d}d`, bg:"#FAEEDA", fg:"#633806" };
  if (d <= 90) return { label:`${d}d`, bg:"#E6F1FB", fg:"#0C447C" };
  return { label:`~${Math.round(d/30.5)}mo`, bg:"#F1EFE8", fg:"#8c8c88" };
}
function isActNow(o) {
  if (o.urgent) return true;
  const d = daysUntil(o.openDate);
  return d !== null && d <= 90;
}

/* ---------- localStorage persistence (works standalone / on GitHub Pages, per-browser) ---------- */
const STORAGE_KEY = "intern-tracker-data-v1";
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { statuses:{}, notes:{}, customOpps:[] };
    const d = JSON.parse(raw);
    return { statuses:d.statuses||{}, notes:d.notes||{}, customOpps:d.customOpps||[] };
  } catch (e) { return { statuses:{}, notes:{}, customOpps:[] }; }
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
  catch (e) { return false; }
}

    openDate:"", appWin:"", dl:"", link:"", angle:"", urgent:false,
  });
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const toggleCat = (c) => setF(prev => ({
    ...prev,
    cats: prev.cats.includes(c) ? prev.cats.filter(x => x !== c) : [...prev.cats, c],
  }));

  const submit = () => {
    if (!f.org.trim() || !f.role.trim()) { alert("Organization and role are required."); return; }
    const id = "custom-" + Date.now();
    onAdd({
      id, org:f.org.trim(), role:f.role.trim(), tier:Number(f.tier),
      cats: f.cats.length ? [...f.cats, "custom"] : ["custom"],
      loc: f.loc.trim() || "—", comp: f.comp.trim() || "—", dur: f.dur.trim() || "—",
      openDate: f.openDate || null,
      appWin: f.appWin.trim() || (f.openDate ? new Date(f.openDate).toLocaleDateString("en-US",{month:"short",year:"numeric"}) : "TBD"),
      dl: f.dl.trim() || "TBD",
      link: f.link.trim(), angle: f.angle.trim(), urgent: f.urgent, custom: true,
    });
  };

  const inputStyle = { width:"100%", fontSize:"13px", padding:"7px 9px", border:"1px solid #d0cfc9", borderRadius:"6px", background:"#fff", color:"#1c1c1a", boxSizing:"border-box", fontFamily:"inherit" };
  const labelStyle = { fontSize:"10px", fontWeight:"600", color:"#8c8c88", textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:"3px", display:"block" };
  const field = (label, node) => h("div", { style:{ marginBottom:"10px" } }, h("label", { style:labelStyle }, label), node);

  return h("div", { style:{ border:"1px solid #d0cfc9", borderRadius:"8px", padding:"14px", marginBottom:"14px", background:"#fff" } },
    h("div", { style:{ fontSize:"13px", fontWeight:"600", marginBottom:"12px", color:"#1c1c1a" } }, "Add your own opportunity"),
    h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px" } },
      field("Organization *", h("input", { style:inputStyle, value:f.org, onChange:e=>set("org", e.target.value), placeholder:"e.g. Notion" })),
      field("Role / title *", h("input", { style:inputStyle, value:f.role, onChange:e=>set("role", e.target.value), placeholder:"e.g. Product intern" })),
    ),
    h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"10px" } },
      field("Location", h("input", { style:inputStyle, value:f.loc, onChange:e=>set("loc", e.target.value), placeholder:"Remote / city" })),
      field("Compensation", h("input", { style:inputStyle, value:f.comp, onChange:e=>set("comp", e.target.value), placeholder:"$/hr or N/A" })),
      field("Duration", h("input", { style:inputStyle, value:f.dur, onChange:e=>set("dur", e.target.value), placeholder:"10 weeks" })),
    ),
    h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"10px" } },
      field("Opens on (date, optional)", h("input", { type:"date", style:inputStyle, value:f.openDate, onChange:e=>set("openDate", e.target.value) })),
      field("Opens (label text)", h("input", { style:inputStyle, value:f.appWin, onChange:e=>set("appWin", e.target.value), placeholder:"e.g. Rolling" })),
      field("Deadline (text)", h("input", { style:inputStyle, value:f.dl, onChange:e=>set("dl", e.target.value), placeholder:"e.g. Mar 1, 2027" })),
    ),
    field("Tier", h("select", { style:inputStyle, value:f.tier, onChange:e=>set("tier", e.target.value) },
      h("option", { value:1 }, "Tier 1 — mission-aligned"),
      h("option", { value:2 }, "Tier 2 — strong fit"),
      h("option", { value:3 }, "Tier 3 — worth watching"),
    )),
    field("Categories", h("div", { style:{ display:"flex", flexWrap:"wrap", gap:"6px" } },
      ALL_CAT_OPTIONS.map(c => {
        const on = f.cats.includes(c);
        const b = CB[c];
        return h("button", {
          key:c, type:"button", onClick:()=>toggleCat(c),
          style:{ fontSize:"11px", padding:"3px 9px", borderRadius:"20px", cursor:"pointer",
                  border: on ? "1px solid transparent" : "1px solid #d0cfc9",
                  background: on ? b.bg : "transparent", color: on ? b.fg : "#8c8c88", fontWeight:"500" },
        }, b.label);
      })
    )),
    field("Link", h("input", { style:inputStyle, value:f.link, onChange:e=>set("link", e.target.value), placeholder:"https://..." })),
    field("Your angle / notes", h("textarea", { style:{...inputStyle, minHeight:"60px", resize:"vertical"}, value:f.angle, onChange:e=>set("angle", e.target.value), placeholder:"Why this is worth pursuing, contacts, next steps..." })),
    h("label", { style:{ fontSize:"12px", color:"#6b6b67", display:"flex", alignItems:"center", gap:"6px", marginBottom:"12px", cursor:"pointer" } },
      h("input", { type:"checkbox", checked:f.urgent, onChange:e=>set("urgent", e.target.checked) }),
      "No fixed deadline — needs direct outreach (flags as \"act now\")"
    ),
    h("div", { style:{ display:"flex", gap:"8px" } },
      h("button", { onClick:submit, style:{ fontSize:"12px", fontWeight:"600", padding:"7px 14px", borderRadius:"20px", border:"none", background:"#1c1c1a", color:"#fff", cursor:"pointer" } }, "Add to tracker"),
      h("button", { onClick:onCancel, style:{ fontSize:"12px", padding:"7px 14px", borderRadius:"20px", border:"1px solid #d0cfc9", background:"transparent", color:"#6b6b67", cursor:"pointer" } }, "Cancel"),
    )
  );
}

/* ---------- main App ---------- */
function App() {
  const ref = useRef({ statuses:{}, notes:{}, customOpps:[] });
  const [statuses, setStatuses] = useState({});
  const [notes, setNotes] = useState({});
  const [customOpps, setCustomOpps] = useState([]);
  const [cat, setCat] = useState("all");
  const [tierF, setTierF] = useState("all");
  const [expanded, setExpanded] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [msg, setMsg] = useState("");
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    const d = loadData();
    ref.current = d;
    setStatuses({ ...d.statuses });
    setNotes({ ...d.notes });
    setCustomOpps([ ...d.customOpps ]);
    setLoaded(true);
  }, []);

  const persist = () => {
    const ok = saveData(ref.current);
    setMsg(ok ? "saved" : "save failed — check browser storage settings");
    setTimeout(() => setMsg(""), 1500);
  };

  const setStatus = (id, v) => {
    ref.current.statuses = { ...ref.current.statuses, [id]: v };
    setStatuses({ ...ref.current.statuses });
    persist();
  };
  const setNote = (id, v) => {
    ref.current.notes = { ...ref.current.notes, [id]: v };
    setNotes({ ...ref.current.notes });
  };
  const addOpp = (opp) => {
    ref.current.customOpps = [ ...ref.current.customOpps, opp ];
    setCustomOpps([ ...ref.current.customOpps ]);
    persist();
    setShowForm(false);
  };
  const deleteOpp = (id) => {
    if (!confirm("Remove this opportunity you added?")) return;
    ref.current.customOpps = ref.current.customOpps.filter(o => o.id !== id);
    setCustomOpps([ ...ref.current.customOpps ]);
    persist();
    if (expanded === id) setExpanded(null);
  };

  const downloadFile = (filename, content, mime) => {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const exportBackup = () => {
    const stamp = new Date().toISOString().slice(0,10);
    downloadFile(`internship-tracker-backup-${stamp}.json`, JSON.stringify(ref.current, null, 2), "application/json");
    setMsg("backup downloaded"); setTimeout(() => setMsg(""), 1500);
  };

  const importInputRef = useRef(null);
  const triggerImport = () => importInputRef.current && importInputRef.current.click();
  const handleImportFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const d = JSON.parse(ev.target.result);
        if (!confirm("This will replace all current tracker data (statuses, notes, and your added opportunities) with the contents of this backup file. Continue?")) return;
        const restored = { statuses: d.statuses||{}, notes: d.notes||{}, customOpps: d.customOpps||[] };
        ref.current = restored;
        setStatuses({ ...restored.statuses });
        setNotes({ ...restored.notes });
        setCustomOpps([ ...restored.customOpps ]);
        persist();
        setMsg("restored from backup");
      } catch (err) {
        alert("That file doesn't look like a valid backup — couldn't parse it as JSON.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const csvEscape = (v) => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const exportCSV = () => {
    const header = ["Organization","Role","Tier","Status","Categories","Location","Compensation","Duration","Opens","Deadline","Link","Angle / Notes (built-in)","Your Notes"];
    const lines = [header.map(csvEscape).join(",")];
    allOpps.forEach(o => {
      lines.push([
        o.org, o.role, o.tier, statuses[o.id]||"Not started", o.cats.join("; "),
        o.loc, o.comp, o.dur, o.appWin, o.dl, o.link, o.angle||"", notes[o.id]||"",
      ].map(csvEscape).join(","));
    });
    const stamp = new Date().toISOString().slice(0,10);
    downloadFile(`internship-tracker-${stamp}.csv`, lines.join("\n"), "text/csv");
    setMsg("CSV downloaded"); setTimeout(() => setMsg(""), 1500);
  };

  const allOpps = [ ...OPPS, ...customOpps ];

  const rows = allOpps.filter(o => {
    const cOk = cat === "all" ? true : cat === "actnow" ? isActNow(o) : o.cats.includes(cat);
    const tOk = tierF === "all" || o.tier === Number(tierF);
    return cOk && tOk;
  });

  const cnt = (...vals) => allOpps.filter(o => vals.includes(statuses[o.id] || "Not started")).length;
  const actN = allOpps.filter(o => isActNow(o) && !["Applied","Waiting","Offer","Accepted","Rejected"].includes(statuses[o.id] || "Not started")).length;

  const pill = (on) => ({
    fontSize:"12px", padding:"4px 10px", border:"1px solid #d0cfc9",
    borderRadius:"20px", cursor:"pointer", fontFamily:"inherit",
    background: on ? "#1c1c1a" : "transparent", color: on ? "#fff" : "#6b6b67",
  });

  const today = new Date().toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" });

  if (!loaded) return h("div", null, "Loading…");

  return h("div", { style:{ padding:"0.5rem 0.25rem" } },
    h("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:"0.75rem", flexWrap:"wrap", gap:"4px" } },
      h("span", { style:{ fontSize:"16px", fontWeight:"700", color:"#1c1c1a" } }, "Summer 2027 Internship Tracker"),
      h("span", { style:{ fontSize:"11px", color:"#8c8c88" } }, "Today: " + today),
    ),

    h("div", { style:{ display:"flex", flexWrap:"wrap", gap:"6px", marginBottom:"1rem" } },
      h("button", { onClick:exportBackup, style:{ fontSize:"11px", padding:"5px 10px", borderRadius:"20px", border:"1px solid #d0cfc9", background:"transparent", color:"#6b6b67", cursor:"pointer" } }, "⬇ Backup (.json)"),
      h("button", { onClick:triggerImport, style:{ fontSize:"11px", padding:"5px 10px", borderRadius:"20px", border:"1px solid #d0cfc9", background:"transparent", color:"#6b6b67", cursor:"pointer" } }, "⬆ Restore from backup"),
      h("input", { ref:importInputRef, type:"file", accept:"application/json", onChange:handleImportFile, style:{ display:"none" } }),
      h("button", { onClick:exportCSV, style:{ fontSize:"11px", padding:"5px 10px", borderRadius:"20px", border:"1px solid #d0cfc9", background:"transparent", color:"#6b6b67", cursor:"pointer" } }, "⬇ Export as spreadsheet (.csv)"),
    ),

    h("div", { style:{ display:"grid", gridTemplateColumns:"repeat(4,minmax(0,1fr))", gap:"8px", marginBottom:"1rem" } },
      [
        { n: allOpps.length, label:"total", c:"#1c1c1a" },
        { n: cnt("Researching","In progress"), label:"in progress", c:"#185FA5" },
        { n: cnt("Applied","Waiting","Offer","Accepted"), label:"applied", c:"#534AB7" },
        { n: actN, label:"act now", c:"#BA7517" },
      ].map(s => h("div", { key:s.label, style:{ background:"#f4f3ef", borderRadius:"8px", padding:"10px 8px", textAlign:"center" } },
        h("div", { style:{ fontSize:"22px", fontWeight:"600", color:s.c, lineHeight:1.1 } }, s.n),
        h("div", { style:{ fontSize:"11px", color:"#8c8c88", marginTop:"2px" } }, s.label),
      ))
    ),

    h("div", { style:{ display:"flex", alignItems:"center", gap:"4px", flexWrap:"wrap", marginBottom:"6px" } },
      CATS.map(c => h("button", { key:c.id, onClick:()=>setCat(c.id), style:pill(cat===c.id) }, c.label)),
      h("div", { style:{ marginLeft:"auto", display:"flex", gap:"4px" } },
        [["all","All"],["1","T1"],["2","T2"],["3","T3"]].map(([id,label]) =>
          h("button", { key:id, onClick:()=>setTierF(id), style:{...pill(tierF===id), fontSize:"11px", padding:"3px 8px"} }, label)
        )
      )
    ),

    h("div", { style:{ margin:"8px 0 14px" } },
      !showForm
        ? h("button", { onClick:()=>setShowForm(true),
            style:{ fontSize:"12px", fontWeight:"600", padding:"7px 14px", borderRadius:"20px", border:"1px dashed #185FA5", background:"#E6F1FB", color:"#0C447C", cursor:"pointer", display:"inline-flex", alignItems:"center", gap:"5px" } },
            h(IPlus, { size:11, color:"#0C447C" }), "Add your own opportunity"
          )
        : h(AddForm, { onAdd:addOpp, onCancel:()=>setShowForm(false) })
    ),

    h("p", { style:{ fontSize:"12px", color:"#8c8c88", margin:"0 0 0.75rem" } },
      `${rows.length}/${allOpps.length} shown · click any row for details + notes${msg ? " · " + msg : ""}`
    ),

    [1,2,3].map(t => {
      const tRows = rows.filter(o => o.tier === t);
      if (!tRows.length) return null;
      return h("div", { key:t },
        h("p", { style:{ fontSize:"11px", fontWeight:"700", letterSpacing:"0.05em", color:"#8c8c88", textTransform:"uppercase", margin:"1.25rem 0 6px" } }, TL[t]),
        tRows.map(o => {
          const status = statuses[o.id] || "Not started";
          const note = notes[o.id] || "";
          const isExp = expanded === o.id;
          const st = SS[status] || SS["Not started"];
          const cd = countdownBadge(o);
          return h("div", { key:o.id, style:{ borderRadius:"8px", border:"1px solid #e0dfd9", borderLeft:`3px solid ${TC[t]}`, marginBottom:"8px", background:"#fff", overflow:"hidden" } },
            h("div", { onClick:()=>setExpanded(isExp?null:o.id), style:{ display:"flex", alignItems:"center", gap:"8px", padding:"10px 12px", cursor:"pointer" } },
              h("div", { style:{ flex:1, minWidth:0 } },
                h("div", { style:{ display:"flex", alignItems:"center", gap:"5px", marginBottom:"2px" } },
                  h("span", { style:{ fontWeight:"600", fontSize:"14px", color:"#1c1c1a", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" } }, o.org),
                  o.eligNote && h(IWarn, { size:12, color:"#BA7517" }),
                  o.custom && h("span", { style:{ fontSize:"9px", padding:"1px 6px", borderRadius:"20px", background:CB.custom.bg, color:CB.custom.fg, fontWeight:"600", flexShrink:0 } }, "yours"),
                ),
                h("div", { style:{ fontSize:"12px", color:"#6b6b67", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" } }, o.role),
              ),
              h("span", { style:{ fontSize:"11px", fontWeight:"600", padding:"2px 8px", borderRadius:"20px", background:cd.bg, color:cd.fg, flexShrink:0, whiteSpace:"nowrap" } }, cd.label),
              h("select", { value:status, onChange:e=>{e.stopPropagation(); setStatus(o.id, e.target.value);}, onClick:e=>e.stopPropagation(),
                style:{ fontSize:"11px", padding:"3px 6px", border:`1px solid ${st.fg}55`, borderRadius:"20px", cursor:"pointer", background:st.bg, color:st.fg, fontWeight:"600", flexShrink:0, maxWidth:"108px", fontFamily:"inherit" } },
                STATUSES.map(s => h("option", { key:s, value:s }, s))
              ),
              isExp ? h(IChevUp, { size:14 }) : h(IChevDown, { size:14 }),
            ),
            isExp && h("div", { style:{ borderTop:"1px solid #e0dfd9", padding:"12px 14px" } },
              o.eligNote && h("div", { style:{ background:"#FAEEDA", borderRadius:"6px", padding:"8px 10px", marginBottom:"10px", fontSize:"12px", color:"#633806", lineHeight:"1.5", display:"flex", gap:"6px" } },
                h(IWarn, { size:13, color:"#633806", style:{ marginTop:"1px", flexShrink:0 } }),
                h("span", null, o.eligNote)
              ),
              h("div", { style:{ display:"flex", flexWrap:"wrap", gap:"12px", marginBottom:"8px" } },
                h("span", { style:{ fontSize:"12px", color:"#6b6b67", display:"flex", alignItems:"center", gap:"3px" } }, h(IPin,{size:11}), o.loc),
                h("span", { style:{ fontSize:"12px", color:"#6b6b67", display:"flex", alignItems:"center", gap:"3px" } }, h(IClock,{size:11}), o.dur),
                h("span", { style:{ fontSize:"12px", color:"#6b6b67", display:"flex", alignItems:"center", gap:"3px" } }, h(IDollar,{size:11}), o.comp),
              ),
              h("div", { style:{ display:"flex", flexWrap:"wrap", gap:"12px", marginBottom:"10px" } },
                h("span", { style:{ fontSize:"12px", color:"#6b6b67", display:"flex", alignItems:"center", gap:"3px" } }, h(ICal,{size:11}), h("b",{style:{fontWeight:"600"}},"Opens:")," ",o.appWin),
                h("span", { style:{ fontSize:"12px", color:"#6b6b67", display:"flex", alignItems:"center", gap:"3px" } }, h(ICal,{size:11}), h("b",{style:{fontWeight:"600"}},"Deadline:")," ",o.dl),
              ),
              h("div", { style:{ display:"flex", gap:"4px", flexWrap:"wrap", marginBottom:"10px" } },
                o.cats.map(c => { const b = CB[c] || { bg:"#F1EFE8", fg:"#444", label:c }; return h("span", { key:c, style:{ fontSize:"11px", padding:"2px 8px", borderRadius:"20px", background:b.bg, color:b.fg, fontWeight:"500" } }, b.label); })
              ),
              o.angle && h("div", { style:{ marginBottom:"10px" } },
                h("div", { style:{ fontSize:"10px", fontWeight:"700", color:"#8c8c88", textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:"4px" } }, "Your angle"),
                h("div", { style:{ fontSize:"13px", color:"#1c1c1a", lineHeight:"1.6" } }, o.angle),
              ),
              h("div", { style:{ marginBottom:"10px", display:"flex", justifyContent:"space-between", alignItems:"center" } },
                o.link ? h("a", { href:o.link, target:"_blank", rel:"noopener noreferrer", style:{ fontSize:"12px", color:"#185FA5", textDecoration:"none", display:"inline-flex", alignItems:"center", gap:"4px" } }, h(ILink,{size:12,color:"#185FA5"}), "Careers page") : h("span"),
                o.custom && h("button", { onClick:()=>deleteOpp(o.id), style:{ fontSize:"11px", color:"#A32D2D", background:"transparent", border:"1px solid #f0c0c0", borderRadius:"20px", padding:"3px 10px", cursor:"pointer", display:"inline-flex", alignItems:"center", gap:"4px" } }, h(ITrash,{size:10,color:"#A32D2D"}), "Remove"),
              ),
              h("div", null,
                h("div", { style:{ fontSize:"10px", fontWeight:"700", color:"#8c8c88", textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:"4px" } }, "Notes"),
                h("textarea", { value:note, onChange:e=>setNote(o.id, e.target.value), onBlur:persist,
                  placeholder:"Contacts, next steps, interview notes, key dates...",
                  style:{ width:"100%", minHeight:"60px", fontSize:"13px", padding:"8px 10px", border:"1px solid #d0cfc9", borderRadius:"6px", background:"#f8f7f3", color:"#1c1c1a", resize:"vertical", boxSizing:"border-box", fontFamily:"inherit", lineHeight:"1.5" } }),
              )
            )
          );
        })
      );
    }),

    h("p", { style:{ fontSize:"11px", fontWeight:"700", letterSpacing:"0.05em", color:"#8c8c88", textTransform:"uppercase", margin:"1.5rem 0 6px" } }, "Watching for 2028 (junior year cycle)"),
    WATCHLIST.map(w => h("div", { key:w.id, style:{ borderRadius:"8px", border:"1px dashed #d0cfc9", padding:"10px 12px", marginBottom:"8px", background:"#f8f7f3" } },
      h("div", { style:{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:"8px", marginBottom:"4px" } },
        h("span", { style:{ fontWeight:"600", fontSize:"13px", color:"#1c1c1a" } }, w.org),
        h("a", { href:w.link, target:"_blank", rel:"noopener noreferrer", style:{ fontSize:"11px", color:"#185FA5", textDecoration:"none", display:"inline-flex", alignItems:"center", gap:"3px", flexShrink:0 } }, h(ILink,{size:11,color:"#185FA5"}), "link"),
      ),
      h("div", { style:{ fontSize:"12px", color:"#6b6b67", marginBottom:"4px" } }, w.role),
      h("div", { style:{ fontSize:"12px", color:"#8c8c88", lineHeight:"1.5" } }, w.why),
    )),

    h("p", { style:{ fontSize:"11px", color:"#8c8c88", marginTop:"1.5rem", borderTop:"1px solid #e0dfd9", paddingTop:"12px" } },
      `${allOpps.length} opportunities (${OPPS.length} built-in + ${customOpps.length} yours) · Saved to this browser's storage. Download a backup periodically — clearing browser data or switching devices/browsers will not carry your saved statuses and notes over.`
    ),
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
